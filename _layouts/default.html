<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.tagline }}">
  <!-- Fonts are set in _config.yml (style.font / style.heading_font) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family={{ site.style.font | replace: ' ', '+' }}:wght@400;700&family={{ site.style.heading_font | replace: ' ', '+' }}:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    {% for s in site.social %}<a href="{{ s.url }}">{{ s.name }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
    <br>© {{ site.title }}
  </footer>
</body>
</html>
