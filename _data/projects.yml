# Research projects, in display order. Images live in /assets/img/.
- title: Understanding human–honeyguide communication
  question: How do synchronized vocalizations help humans and honeyguides solve a shared navigation problem, and what dynamical principles govern their coordination?
  summary: >
    In collaboration with Prof. Claire Spottiswoode FRS and her team at the University of Cape Town,
    I study how humans and Greater Honeyguides (<i>Indicator indicator</i>) communicate in real time
    as they navigate together to wild bee nests. I use mathematical and AI-based, data-driven models
    of this two-way communication between people and a free-living wild animal.
  links:
    - {label: Spottiswoode group, url: "https://science.uct.ac.za/fitzpatrick/claire-spottiswoode"}
    - {label: Honeyguide–human mutualism research, url: "https://science.uct.ac.za/fitzpatrick/research-understanding-biodiversity-evolutionary-and-behavioural-ecology/evolution-ecology-and-conservation-honeyguide-human-mutualism"}

- title: "Measuring Mather: measurement, interpretation, and learning in a coupled human–infrastructure system"
  question: How should sustainability experiments be designed in residential settings, where people adapt to what is being measured?
  summary: >
    The Measuring Mather project instruments, models, and interprets energy use, environmental
    conditions, and food waste in a large Harvard undergraduate residence that serves as a living laboratory.
  methods:
    - Continuous environmental sensing
    - Analysis of power and steam use
    - Machine-vision estimation of food waste
    - Physical prototyping of ventilation and cooling
    - Ongoing community engagement
  links:
    - {label: Harvard College news, url: "https://college.harvard.edu/about/news/sustainability-shines-through-measure-mather"}
    - {label: The Harvard Crimson, url: "https://www.thecrimson.com/article/2025/10/30/mather-sustainability-and-waste-initiative/"}

- title: Adaptability of honeycomb structure
  question: What patterns emerge as honeybees collectively build and adapt their comb on surfaces with different geometric frustrations?
  methods:
    - Data collection with 3D-printed panels that test how bees respond to different initial conditions
    - X-ray microscopy to identify building modes and patterns in comb built on experimental frames
    - Mathematical and physical modeling of the observed patterns
  images:
    - dsc_2207.jpeg
    - 20191129_200323.jpg
    - dsc_2222-1-1.jpeg
    - apiary_flowers-copy.jpg

- title: Collective resource distribution in honeybees
  question: How do honeybees communicate to find fed individuals during trophallaxis (food-sharing) exchanges?
  methods:
    - In-lab video recordings of fed and food-deprived honeybee groups exchanging food
    - Topological data analysis to characterize food distribution and detect shifts in behavioral regimes
    - Data-driven agent-based models to identify the local rules behind resource distribution
  images:
    - trophallaxis.jpeg
    - trophallaxis_setup_camera_view.jpg
